<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Claude Code Wrapped</title>
  <meta name="description" content="A local checkup for Claude Code: what oversized context, cache misses and the wrong model cost you, where the agent gets stuck, and how to fix it. Plus your Wrapped story. Runs on your machine. Unofficial.">
  <meta property="og:title" content="Claude Code Wrapped">
  <meta property="og:description" content="See what your Claude Code habits cost in dollars, where the agent gets stuck, and what to change. Then share your Wrapped. Nothing is uploaded.">
  <meta property="og:url" content="https://zenpasdan1-ai.github.io/claude-code-wrapped/">
  <meta property="og:image" content="https://zenpasdan1-ai.github.io/claude-code-wrapped/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://zenpasdan1-ai.github.io/claude-code-wrapped/og.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <main class="landing" aria-labelledby="title">
    <header class="top">
      <p class="brand">wrapped<span>.</span></p>
      <button class="lang-toggle" type="button">RU</button>
    </header>

    <div class="hero">
      <div class="hero-copy">
        <h1 id="title" data-t="title">Claude Code Wrapped</h1>
        <p class="tagline" data-t="tagline"></p>
        <p class="lead" data-t="lead"></p>
        <p class="demo-row"><button class="btn demo" type="button" data-t="demo"></button> <span data-t="demoHint"></span></p>

        <div class="cli-box">
          <p data-t="cliHint"></p>
          <p class="cmd-row"><code class="cmd cli"></code><button class="btn btn-small copy-cli" type="button" data-t="copyCmd"></button></p>
          <p class="cli-status status" role="status"></p>
        </div>

        <div class="drop">
          <label class="btn btn-hot pick" for="folder" data-t="pickFolder"></label>
          <input id="folder" class="sr-only" type="file" webkitdirectory directory multiple>
          <label class="pick-files" for="files" data-t="pickFiles"></label>
          <input id="files" class="sr-only" type="file" multiple accept=".jsonl,application/x-ndjson,application/json">
          <p class="drop-hint" data-t="orDrop"></p>
          <p class="pick-error" role="alert"></p>
          <p class="progress" role="status" hidden></p>
        </div>

        <p class="period-row">
          <label for="period" data-t="period"></label>
          <select id="period" class="period">
            <option value="all" data-t="periodAll"></option>
            <option value="year" data-t="periodYear"></option>
            <option value="90" data-t="period90"></option>
            <option value="30" data-t="period30"></option>
            <option value="19h" data-t="period19h"></option>
          </select>
        </p>

        <p class="privacy"><span aria-hidden="true">●</span> <span data-t="privacy"></span></p>
        <div class="hidden-help">
          <p data-t="hiddenHint"></p>
          <p class="cmd-row"><code class="cmd"></code><button class="btn btn-small copy-cmd" type="button" data-t="copyCmd"></button></p>
          <p class="cmd-status status" role="status"></p>
        </div>
      </div>
      <figure class="preview-wrap">
        <img class="preview" alt="">
        <figcaption data-t="demoTag"></figcaption>
      </figure>
    </div>

    <footer class="foot" data-t="unofficial"></footer>
  </main>

  <main class="report" aria-label="Checkup" hidden>
    <div class="report-bar">
      <span class="demo-tag" data-t="demoTag"></span>
      <select id="period-report" class="period period-small" aria-label="Period">
        <option value="all" data-t="periodAll"></option>
        <option value="year" data-t="periodYear"></option>
        <option value="90" data-t="period90"></option>
        <option value="30" data-t="period30"></option>
        <option value="19h" data-t="period19h"></option>
      </select>
      <button class="lang-toggle" type="button">RU</button>
      <button class="restart-report btn btn-small" type="button" data-t="restart"></button>
    </div>
    <p class="view-status" role="status"></p>
    <div class="report-body"></div>
  </main>

  <main class="story" aria-label="Story" hidden>
    <h1 class="sr-only" data-t="title">Claude Code Wrapped</h1>
    <div class="story-top">
      <div class="bars-top" aria-hidden="true"></div>
      <div class="story-meta">
        <span class="demo-tag" data-t="demoTag"></span>
        <select id="period-story" class="period period-small" aria-label="Period">
          <option value="all" data-t="periodAll"></option>
          <option value="year" data-t="periodYear"></option>
          <option value="90" data-t="period90"></option>
          <option value="30" data-t="period30"></option>
          <option value="19h" data-t="period19h"></option>
        </select>
        <button class="restart btn btn-small" type="button" data-t="backToCheckup"></button>
      </div>
      <p class="view-status" role="status"></p>
    </div>
    <div class="slide" role="group" aria-roledescription="slide"></div>
    <nav class="story-nav" aria-label="Story navigation">
      <button class="btn prev" type="button" data-t="prev"></button>
      <button class="btn btn-hot next" type="button" data-t="next"></button>
    </nav>
  </main>

  <textarea id="fallback-text" class="fallback-text" aria-label="Text to copy" rows="3" hidden></textarea>

  <script type="module" src="js/main.js?v=19h"></script>
</body>
</html>
